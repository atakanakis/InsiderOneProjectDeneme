name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

  test:
    # Unit and integration tests; testcontainers starts Postgres and Redis
    # on the runner's Docker daemon.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test (race detector, coverage)
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  e2e:
    # Boots the real docker-compose stack and pushes a notification through
    # API -> queue -> worker -> mock provider.
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v5
      - name: Start stack
        run: docker compose up --build -d --wait api worker
      - name: Deliver a notification end to end
        run: |
          id=$(curl -sf -X POST localhost:8080/v1/notifications \
                 -H 'Content-Type: application/json' \
                 -d '{"recipient":"+905551234567","channel":"sms","content":"ci smoke test","priority":"high"}' \
               | jq -r .id)
          for i in $(seq 1 30); do
            status=$(curl -sf localhost:8080/v1/notifications/$id | jq -r .status)
            echo "status: $status"
            [ "$status" = "sent" ] && exit 0
            sleep 1
          done
          exit 1
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200
      - name: Stop stack
        if: always()
        run: docker compose down -v
