version: "2"

linters:
  # Defaults (errcheck, govet, ineffassign, staticcheck, unused) plus checks
  # that catch real bugs in this kind of code: leaked bodies/rows, wrong
  # error comparisons, missing contexts on HTTP requests, security smells.
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - unconvert
  settings:
    gosec:
      excludes:
        - G404 # math/rand is fine for jitter and the mock provider's failure injection
  exclusions:
    presets: [std-error-handling]
    rules:
      - path: _test\.go
        linters: [gosec, noctx, bodyclose]

formatters:
  enable: [gofmt, goimports]
  settings:
    goimports:
      local-prefixes: [github.com/atakanakis/notification-engine]
